name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration + business (E2E) tests"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + ArchUnit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Compile (fail fast)
        run: ./gradlew compileJava compileTestJava --stacktrace

      - name: Unit + architecture tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/test/**
            **/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7

  integration-e2e:
    name: Integration + Business (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Toggle the heavy Docker/Testcontainers suite off two ways:
    #   - persistent: set repo variable RUN_INTEGRATION_TESTS=false (skips on push/PR)
    #   - ad-hoc:     run via "Run workflow" with run_integration=false
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_integration) ||
      (github.event_name != 'workflow_dispatch' && vars.RUN_INTEGRATION_TESTS != 'false')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # --max-workers=2 bounds concurrent Testcontainers stacks so the suite does not
      # exhaust Postgres connections (the connection-reset flake seen under full parallelism).
      # --continue runs every module's suite so all failures surface in one run.
      - name: Integration + business tests
        run: ./gradlew integrationTest businessTest --max-workers=2 --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-e2e-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
