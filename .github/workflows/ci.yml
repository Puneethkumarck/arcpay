name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration + business (E2E) tests"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + ArchUnit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Compile (fail fast)
        run: ./gradlew compileJava compileTestJava --stacktrace

      - name: Format check (Spotless)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Unit + architecture tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/test/**
            **/build/test-results/test/**
          if-no-files-found: ignore
          retention-days: 7

  integration-e2e:
    name: Integration + E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Ephemeral runners are discarded after the job, so the Ryuk reaper isn't needed —
      # disabling it removes a Docker Hub image pull (testcontainers/ryuk) that was timing out.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Mapped from secrets so the optional Docker Hub login below can gate on presence.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    # Toggle the heavy Docker/Testcontainers suite off two ways:
    #   - persistent: set repo variable RUN_INTEGRATION_TESTS=false (skips on push/PR)
    #   - ad-hoc:     run via "Run workflow" with run_integration=false
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_integration) ||
      (github.event_name != 'workflow_dispatch' && vars.RUN_INTEGRATION_TESTS != 'false')
    # One service per runner: each service's Testcontainers stacks (Postgres/Kafka/Temporal)
    # are isolated, so the suites do not contend for memory on a single runner (the cause of
    # the Postgres "connection refused" flake when all 5 ran together). Also runs in parallel.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: identity, module: "identity:identity" }
          - { name: policy-engine, module: "policy-engine:policy-engine" }
          - { name: compliance, module: "compliance:compliance" }
          - { name: payment-execution, module: "payment-execution:payment-execution" }
          - { name: settlement, module: "settlement:settlement" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Raises Docker Hub pull rate limits (anonymous limits are shared per runner IP and
      # cause transient image-pull failures). No-op until DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
      # repo secrets are set.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Integration + business tests (${{ matrix.name }})
        run: ./gradlew :${{ matrix.module }}:integrationTest :${{ matrix.module }}:businessTest --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-e2e-reports-${{ matrix.name }}
          path: |
            ${{ matrix.name }}/**/build/reports/tests/**
            ${{ matrix.name }}/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
