spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: compliance-biz-${random.uuid}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  temporal:
    test-server:
      enabled: true

namastack:
  outbox:
    enabled: true

arcpay:
  identity-service:
    url: http://localhost:8080
  security:
    service-token: test-service-token

compliance:
  onchain:
    usdc-contract: "0x0000000000000000000000000000000000000000"
