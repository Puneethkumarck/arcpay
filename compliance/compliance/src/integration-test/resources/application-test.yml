spring:
  datasource:
    hikari:
      # Each full-context test class with its own @DynamicPropertySource gets a
      # separately-cached ApplicationContext, each holding its own connection pool.
      # Bound the pool (and let it shrink to near-idle) so the shared Postgres
      # container does not hit max_connections ("too many clients already").
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: compliance-test-${random.uuid}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  temporal:
    test-server:
      enabled: true

namastack:
  outbox:
    enabled: true

arcpay:
  identity-service:
    url: http://localhost:8080
  security:
    service-token: test-service-token

compliance:
  onchain:
    usdc-contract: "0x0000000000000000000000000000000000000000"
