org.gradle.parallel=true
org.gradle.caching=true
# palantir-java-format (Spotless) reflects into the JDK compiler internals, which
# JDK 16+ blocks by default; these exports let it run on the JDK 25 toolchain.
org.gradle.jvmargs=-Xmx2g \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED

# Shared versions — accessible in both buildSrc and main build
springBootVersion=4.0.6
springCloudVersion=2025.1.1
lombokVersion=1.18.46
mapstructVersion=1.6.3
namastackVersion=1.6.0
temporalVersion=1.35.0
web3jVersion=4.14.0
flywayVersion=11.20.3
uuidCreatorVersion=6.1.1
archunitVersion=1.4.2
testcontainersVersion=2.0.5
wiremockVersion=3.13.2
assertjVersion=3.27.7
junitVersion=5.14.4
hibernateValidatorVersion=9.1.0.Final
expresslyVersion=6.0.0
springdocVersion=3.0.3
